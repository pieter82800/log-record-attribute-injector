[project]
name = "log-record-attribute-injector"
version = "0.1.0"
description = "A logging.Filter subclass that adds predefined attributes like request_id and hostname to every LogRecord before formatting."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
